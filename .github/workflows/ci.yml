name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, windows-2025]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - if: runner.os == 'macOS'
        run: sh -n install.sh
      - run: node --check install.mjs
      - run: npm ci --prefix wecom-codex --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm install --global @openai/codex@0.170.0
      - run: node --test
        env:
          WE_COM_TEST_CODEX: "1"
