name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: sh -n install.sh
      - run: npm ci --prefix wecom-codex --omit=dev --ignore-scripts --no-audit --no-fund
      - run: node --test test/*.test.mjs
