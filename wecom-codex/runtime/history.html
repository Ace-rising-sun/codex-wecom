<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会话历史</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
    body { margin: 0; color: var(--color-text-primary, CanvasText); background: transparent; }
    main { max-width: 640px; margin: auto; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    ol { margin: 0; padding: 0; list-style: none; }
    li { border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: .6; }
    button:focus-visible { outline: 2px solid Highlight; outline-offset: -2px; }
    .conversation { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; width: 100%; border: 0; border-radius: 8px; padding: 10px 6px; text-align: start; background: transparent; }
    .conversation:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    .title { font-weight: 600; overflow-wrap: anywhere; }
    .details, #status { color: var(--color-text-secondary, GrayText); font-size: 12px; }
    .details { grid-row: 2; }
    .arrow { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 20px; }
    #more { border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 8px; padding: 6px 12px; background: transparent; }
    #status { margin: 10px 0; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>会话历史</h1>
    <ol id="threads" aria-label="企微 Codex 会话"></ol>
    <p id="status" role="status">正在读取会话…</p>
    <button id="more" type="button" hidden>加载更多</button>
  </main>
  <script>
    'use strict';

    const threads = document.getElementById('threads');
    const status = document.getElementById('status');
    const more = document.getElementById('more');
    const pending = new Map();
    const formatDate = new Intl.DateTimeFormat('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    let sequence = 0;
    let cursor;

    const emit = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
    window.addEventListener('message', ({ source, data }) => {
      if (source !== window.parent || data?.jsonrpc !== '2.0') return;
      pending.get(data.id)?.(data);
    });

    function request(method, params) {
      return new Promise((resolve, reject) => {
        const id = ++sequence;
        const timer = setTimeout(() => {
          pending.delete(id);
          reject(new Error('请求超时，请重试。'));
        }, 15_000);
        pending.set(id, response => {
          clearTimeout(timer);
          pending.delete(id);
          if (response.error) reject(new Error('Codex 无法处理此请求。'));
          else resolve(response.result);
        });
        emit({ id, method, params });
      });
    }

    async function tool(name, args = {}) {
      const result = await request('tools/call', { name, arguments: args });
      if (result?.isError) throw new Error(result.content?.[0]?.text || '会话请求失败。');
      return result.structuredContent;
    }

    function appendThread(thread) {
      const row = document.createElement('li');
      const button = document.createElement('button');
      const title = document.createElement('span');
      const details = document.createElement('span');
      const arrow = document.createElement('span');
      button.type = 'button';
      button.className = 'conversation';
      title.className = 'title';
      title.textContent = thread.title;
      details.className = 'details';
      details.textContent = [thread.workspace, formatDate.format(thread.updatedAt), thread.archived ? '已归档' : '']
        .filter(Boolean).join(' · ');
      arrow.className = 'arrow';
      arrow.textContent = '›';
      arrow.setAttribute('aria-hidden', 'true');
      button.append(title, details, arrow);
      row.append(button);
      threads.append(row);
      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = '';
        try {
          await tool('wecom.history.openThread', { id: thread.id });
        } catch (error) {
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    }

    async function loadPage() {
      more.disabled = true;
      status.textContent = '正在读取会话…';
      try {
        const page = await tool('wecom.history.list', cursor ? { cursor } : {});
        page.threads.forEach(appendThread);
        cursor = page.nextCursor;
        more.hidden = !cursor;
        more.textContent = '加载更多';
        status.textContent = threads.childElementCount ? '' : '还没有企微 Codex 会话。';
      } catch (error) {
        status.textContent = error.message;
        more.textContent = '重试';
        more.hidden = false;
      } finally {
        more.disabled = false;
      }
    }

    more.addEventListener('click', loadPage);
    request('ui/initialize', { appInfo: { name: 'wecom-codex-history', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
      .then(() => {
        emit({ method: 'ui/notifications/initialized' });
        new ResizeObserver(() => emit({ method: 'ui/notifications/size-changed', params: { height: document.body.scrollHeight } }))
          .observe(document.body);
        return loadPage();
      })
      .catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
